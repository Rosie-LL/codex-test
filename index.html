<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一个热爱生活、保持好奇的人的个人介绍。">
  <title>你好，很高兴认识你</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 40px 24px;
      background: #f3f5f8;
      color: #283548;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    main { width: min(100%, 540px); text-align: center; }
    .avatar {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 0 auto 32px;
      overflow: hidden;
      border-radius: 50%;
      background: #e0e6ee;
    }
    .avatar::before {
      content: "";
      position: absolute;
      top: 20px;
      left: 33px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #8192a8;
    }
    .avatar::after {
      content: "";
      position: absolute;
      bottom: -12px;
      left: 17px;
      width: 62px;
      height: 52px;
      border-radius: 50% 50% 0 0;
      background: #8192a8;
    }
    h1 {
      margin: 0 0 20px;
      font-size: clamp(28px, 6vw, 38px);
      line-height: 1.5;
      font-weight: 600;
      letter-spacing: -0.5px;
    }
    p { margin: 0; color: #5f6d80; font-size: 16px; line-height: 2; }
  </style>
</head>
<body>
  <main>
    <div class="avatar" aria-hidden="true"></div>
    <h1>你好，很高兴认识你。</h1>
    <p>我是一个热爱生活、保持好奇的人，喜欢阅读、摄影，也喜欢用代码把想法变成现实。希望在这里，与你分享日常的发现、探索的乐趣，以及一点一滴的成长。</p>
  </main>
</body>
</html>
